# 工作流引擎配置

server:
  host: "0.0.0.0"
  port: 8001

database:
  path: "data/workflow.db"

# 模型配置（可选，不配置则使用模拟模式）
# providers:
#   deepseek:
#     api_key: "your-api-key"
#     base_url: "https://api.deepseek.com"
#     models:
#       - "deepseek-chat"

agent:
  default_model: "deepseek-chat"
  max_steps: 10
  temperature: 0.7
  max_tokens: 4096
